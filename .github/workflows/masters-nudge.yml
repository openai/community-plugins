name: Masters’ Nudge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masters-nudge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  masters-nudge:
    name: Masters’ Nudge master suite
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Catalog and complete suite / Python 3.10
        run: |
          npm run validate:marketplace
          npm run test:masters-nudge
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Complete suite / Python 3.14
        run: npm run test:masters-nudge

name: Electron Agent Debug
on:
  pull_request:
    paths:
      - 'plugins/electron-agent-debug/**'
      - 'tests/electron-agent-debug/**'
      - 'scripts/validate-electron-agent-debug.mjs'
      - '.github/workflows/electron-agent-debug.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'plugins/electron-agent-debug/**'
      - 'tests/electron-agent-debug/**'
      - 'scripts/validate-electron-agent-debug.mjs'
      - '.github/workflows/electron-agent-debug.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run master suite on Node 22
        run: npm run test:electron-agent-debug
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run master suite on Node 24
        run: npm run test:electron-agent-debug

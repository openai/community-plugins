name: Ponder

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ponder-e2e:
    name: Ponder E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Cold copied package / Node 22.19.0
        run: node --test --test-concurrency=1 tests/ponder/integration/packaged.test.mjs
      - name: Full Ponder qualification / Node 22.19.0
        run: npm run test:ponder

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Full uninstrumented suite / Node 24
        run: npm run test:ponder

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Full uninstrumented suite / Node 26
        run: npm run test:ponder

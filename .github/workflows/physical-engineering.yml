name: Physical Engineering

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-engineering-e2e:
    name: Physical Engineering E2E
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PE_RUNTIME: ${{ runner.temp }}/physical-engineering-runtime
      PE_PYTHON: ${{ runner.temp }}/physical-engineering-runtime/bin/python
      PYTHONDONTWRITEBYTECODE: "1"
      CAD_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Prepare the pinned CAD runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.7
          python plugins/physical-engineering/scripts/engineering.py setup --runtime "$PE_RUNTIME"
      - name: Catalog and complete master suite / Node 22.19.0
        run: npm run validate:marketplace && npm run test:physical-engineering

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Complete master suite / Node 24
        run: npm run test:physical-engineering

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Complete master suite / Node 26
        run: npm run test:physical-engineering
      - name: Verify tracked package remains unchanged
        run: git diff --exit-code -- plugins/physical-engineering

# One plugin workflow, one master job. Geometry checks do not establish installed
# Codex behavior, graphical recording or independent facilitator acceptance.

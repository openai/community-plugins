name: Physical Engineering

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-engineering-e2e:
    name: Physical Engineering E2E
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CAD_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Prepare the pinned CAD runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.7
          python plugins/physical-engineering/scripts/engineering.py setup --runtime "$RUNNER_TEMP/physical-engineering-runtime"
          printf 'PE_RUNTIME=%s\n' "$RUNNER_TEMP/physical-engineering-runtime" >> "$GITHUB_ENV"
          printf 'PE_PYTHON=%s\n' "$RUNNER_TEMP/physical-engineering-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Catalog and complete master suite / Node 22.19.0
        run: npm run validate:marketplace && npm run test:physical-engineering

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Complete master suite / Node 24
        run: npm run test:physical-engineering

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Complete master suite / Node 26
        run: npm run test:physical-engineering
      - name: Verify tracked package remains unchanged
        run: git diff --exit-code -- plugins/physical-engineering
      - name: Audit pinned CAD and demo dependencies
        run: |
          uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --requirement plugins/physical-engineering/scripts/requirements.txt --format json --output "$RUNNER_TEMP/physical-engineering-audit.json"
          uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --requirement tests/physical-engineering/support/showcase/narration/requirements.lock --format json --output "$RUNNER_TEMP/physical-engineering-narration-audit.json"
          npm --prefix tests/physical-engineering/support/showcase audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org

# One plugin workflow, one master job. Geometry checks do not establish installed
# Codex behavior, graphical recording or independent facilitator acceptance.

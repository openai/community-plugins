name: Fork Chat Fixed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkbuggedchat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forkbuggedchat:
    name: Fork Chat Fixed
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Marketplace and master suite / Node 22.19.0
        run: npm run validate:marketplace && npm run test:forkbuggedchat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Master suite / Node 24
        run: npm run test:forkbuggedchat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Master suite / Node 26
        run: npm run test:forkbuggedchat

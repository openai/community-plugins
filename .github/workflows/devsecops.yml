name: DevSecOps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devsecops:
    name: DevSecOps master suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned dependency manager
        run: python -m pip install --disable-pip-version-check uv==0.13.7
      - name: Complete master including all packaged Python cases, real tools and reproducible package
        run: npm run test:devsecops
      - name: Audit locked runtime dependencies
        run: |
          uv export --project plugins/devsecops --frozen --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/devsecops-runtime-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/devsecops-runtime-requirements.txt" --format json --output "$RUNNER_TEMP/devsecops-dependency-audit.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package, integration and privacy contracts on Node 24
        run: DEVSECOPS_TEST_CONTEXT="$HOME/.cache/devsecops/community-tests/latest-context.json" npm run test:devsecops:contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Package, integration and privacy contracts on Node 26
        run: DEVSECOPS_TEST_CONTEXT="$HOME/.cache/devsecops/community-tests/latest-context.json" npm run test:devsecops:contracts
      - name: Verify checkout unchanged
        run: git diff --exit-code -- plugins/devsecops
      - name: Retain test receipts and explicit coverage gaps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsecops-automated-evidence
          path: |
            ~/.cache/devsecops/community-tests/results/**/master.json
            ~/.cache/devsecops/community-tests/results/**/python-suite.json
            ~/.cache/devsecops/community-tests/results/**/junit.xml
            ~/.cache/devsecops/community-tests/results/**/collection.json
            ~/.cache/devsecops/community-tests/results/**/outcomes.jsonl
            ~/.cache/devsecops/community-tests/results/**/package-check-*.json
            ${{ runner.temp }}/devsecops-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

# One sequential job. The Python suite is independent of Node and runs once;
# the Node entrypoint/package contracts run on 22.19, 24 and 26. Native Codex,
# macOS sandbox, genuine retained CVE data and live platform/video acceptance
# remain explicit separate coverage gaps, never inferred from this job.

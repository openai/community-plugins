apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mission
  template:
    metadata:
      labels:
        app: mission
    spec:
      containers:
        - name: mission
          image: registry.example.invalid/mission@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false

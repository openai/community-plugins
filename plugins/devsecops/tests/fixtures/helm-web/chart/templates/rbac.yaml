{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: review-demo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.labels.team | quote }}
rules:
  - apiGroups: [""]
    resources:
      {{- toYaml .Values.rbac.resources | nindent 6 }}
    verbs:
      {{- toYaml .Values.rbac.verbs | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: review-demo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.labels.team | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-web
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-web
{{- end }}

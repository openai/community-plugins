{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: review-demo-web
    app.kubernetes.io/instance: {{ .Release.Name }}
    team: {{ .Values.labels.team | quote }}
type: Opaque
stringData:
  token: {{ .Values.secret.token | quote }}
data:
  token-copy: {{ .Values.secret.token | b64enc | quote }}
{{- end }}

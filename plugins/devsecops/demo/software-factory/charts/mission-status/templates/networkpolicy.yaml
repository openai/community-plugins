apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mission.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mission.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mission.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mission.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.healthPeer.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.healthPeer.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mission.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mission.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsPeer.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsPeer.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.metricsPort }}
